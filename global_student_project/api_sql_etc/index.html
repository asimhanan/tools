<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern weather dashboard with current conditions and forecasts.">
  <title>Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Weather dashboard home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6.8 19h9.7a4.5 4.5 0 0 0 .4-9 6.3 6.3 0 0 0-12-1.5A5.3 5.3 0 0 0 6.8 19Z"/><path d="M8 21h8"/></svg>
        </span>
        <span>Weatherly</span>
      </a>

      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input id="search-input" type="search" placeholder="Search city..." aria-label="Search city" autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <button class="location-button" id="location-button" type="button" aria-label="Use my location">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
      </button>
    </header>

    <section class="weather-grid" aria-live="polite">
      <article class="current-card panel">
        <div class="current-heading">
          <div>
            <p class="eyebrow">Current weather</p>
            <h1 id="location-name">Loading...</h1>
            <p id="current-date" class="muted"></p>
          </div>
          <span class="status-badge" id="weather-status">--</span>
        </div>

        <div class="current-main">
          <div class="weather-icon" id="current-icon" aria-hidden="true">--</div>
          <div>
            <div class="temperature"><span id="current-temp">--</span><sup>°</sup></div>
            <p id="feels-like" class="feels-like">Feels like --°</p>
          </div>
        </div>

        <div class="metrics">
          <div class="metric">
            <span class="metric-icon">♨</span>
            <div><p>Humidity</p><strong id="humidity">--%</strong></div>
          </div>
          <div class="metric">
            <span class="metric-icon">↗</span>
            <div><p>Wind</p><strong id="wind">-- km/h</strong></div>
          </div>
          <div class="metric">
            <span class="metric-icon">◉</span>
            <div><p>Pressure</p><strong id="pressure">-- hPa</strong></div>
          </div>
        </div>
      </article>

      <aside class="forecast-card panel">
        <div class="section-heading">
          <h2>7-day forecast</h2>
          <span id="timezone">Local time</span>
        </div>
        <div class="forecast-list" id="forecast-list">
          <p class="loading">Loading forecast...</p>
        </div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="js/app.js"></script>
</body>
</html>
